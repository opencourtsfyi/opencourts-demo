# Ruff config for the ETL package.
# Using ruff.toml (not pyproject.toml) because etl/.gitignore currently
# ignores pyproject.toml while UV/dependency management is undecided (#33).

src = ["src"]
extend-exclude = ["data"]
# Match CI (.github/workflows/tests.yml).
target-version = "py314"

[lint]
# Explicit classic "basic" defaults (pycodestyle errors + Pyflakes).
# Ruff 0.17 enables a much larger built-in set; keep this PR scoped.
select = ["E4", "E7", "E9", "F"]
