name: Playwright Tests
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/playwright.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      # The Playwright container runs as root by default, 
      # which can cause permission issues when writing 
      #files to the host filesystem. To avoid this, 
      # we run the container as a non-root user (1001) 
      #and set the IPC mode to host.
      options: --user 1001 --init --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30