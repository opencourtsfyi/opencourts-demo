name: Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'etl/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements-dev.txt

      - name: Run tests and generate coverage report
        working-directory: etl
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=json:coverage.json

      - name: Generate coverage badge and evaluate thresholds
        run: |
          python .github/scripts/generate_coverage_badge.py etl/coverage.json

      - name: Commit and push updated badge (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/coverage.svg .github/badges/coverage.json
          git diff --staged --quiet || git commit -m "ci: update coverage badge [skip ci]"
          git push

      - name: Enforce minimum coverage threshold (>= 70%)
        working-directory: etl
        run: |
          python -m coverage report --fail-under=70
